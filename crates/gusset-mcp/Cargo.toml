[package]
name = "gusset-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gusset, an open sheet metal kernel, as an MCP server: AI agents model sheet metal parts and get flat patterns, mass, bend tables, shop checks and STEP/DXF/SVG."
publish = false

[dependencies]
gusset-sheet = { path = "../gusset-sheet" }
gusset-export = { path = "../gusset-export" }
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
