[package]
name = "gusset-wasm"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gusset, an open sheet metal kernel, for the browser: flat patterns, folded meshes, DXF and STEP from a part description."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gusset-sheet = { path = "../gusset-sheet" }
gusset-export = { path = "../gusset-export" }
opengeometry = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2"
