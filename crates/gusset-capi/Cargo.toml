[package]
name = "gusset-capi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gusset, an open sheet metal kernel, as a C library: flat DXF, STEP and mass from a part description."
publish = false

[lib]
name = "gusset"
crate-type = ["cdylib", "rlib"]

[dependencies]
gusset-sheet = { path = "../gusset-sheet" }
gusset-export = { path = "../gusset-export" }
serde_json = "1"
